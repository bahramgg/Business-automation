name = "afa-lead-intake"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Secrets (NEVER here):
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID

[[d1_databases]]
binding = "LEADS"
database_name = "afa-leads"
database_id = "replace-with-your-d1-database-id"

[[kv_namespaces]]
binding = "LEAD_RATELIMIT"
id = "replace-with-your-kv-namespace-id"

[vars]
ALLOWED_ORIGINS = "https://afa.example,http://localhost:3000"
